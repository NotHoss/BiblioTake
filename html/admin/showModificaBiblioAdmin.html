<h1>Modifica generalità biblioteca</h1>

<form class="form admin-form" method="post">
    <input type="hidden" name="azione" value="aggiorna_generalita">
    <input type="hidden" name="biblioteca_id" value="[BIBLIOTECA_ID]">

    <fieldset>
        <legend>Generalità</legend>
        <p><label for="indirizzo">Indirizzo</label><input type="text" id="indirizzo" name="indirizzo" value="[INDIRIZZO]" required minlength="1" maxlength="100"></p>
        <p><label for="telefono">Telefono</label><input type="text" id="telefono" name="telefono" value="[TELEFONO]" required minlength="6" maxlength="20" pattern="[0-9 +()\-\/]{6,20}"></p>
        <p><label for="email">Email</label><input type="email" id="email" name="email" value="[EMAIL]" required maxlength="255"></p>
    </fieldset>

    <fieldset>
        <legend>Orari e note</legend>
        <p><label for="orario_lun_ven">Orario Lun-Ven</label><input type="text" id="orario_lun_ven" name="orario_lun_ven" value="[ORARIO_LUN_VEN]" required minlength="1" maxlength="100"></p>
        <p><label for="orario_sabato">Orario Sabato</label><input type="text" id="orario_sabato" name="orario_sabato" value="[ORARIO_SABATO]" required minlength="1" maxlength="100"></p>
        <p><label for="orario_domenica">Orario Domenica</label><input type="text" id="orario_domenica" name="orario_domenica" value="[ORARIO_DOMENICA]" required minlength="1" maxlength="100"></p>
        <p><label for="note">Note</label><textarea id="note" name="note" rows="4" maxlength="500">[NOTE]</textarea></p>
    </fieldset>

    <fieldset>
        <legend>Azioni</legend>
        <p><button type="submit">Aggiorna generalità</button> <a href="index.php">Annulla</a></p>
    </fieldset>
</form>
