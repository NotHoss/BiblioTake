<h1>Elimina prestito</h1>

[MESSAGES]

<form class="form admin-form" method="post">
    <input type="hidden" name="prestito_id" value="[PRESTITO_ID]">
    <fieldset>
        <legend>Conferma eliminazione</legend>
        <p>Stai per eliminare questo prestito in modo definitivo.</p>
        [SUMMARY]
    </fieldset>
    <fieldset>
        <legend>Azioni</legend>
        <p><button type="submit" name="azione" value="elimina">Conferma eliminazione</button> <a href="[ANNULLA_HREF]">Annulla</a></p>
    </fieldset>
</form>
