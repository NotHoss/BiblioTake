<h1>Elimina recensione</h1>

[MESSAGES]

[NOT_FOUND_MESSAGE]

<div [FORM_DISPLAY]>
	<form class="form admin-form" method="post">
		<input type="hidden" name="id" value="[RECENSIONE_ID]">
		<input type="hidden" name="utente_id" value="[UTENTE_ID]">
		<fieldset>
			<legend>Conferma eliminazione</legend>
			<p>Stai per eliminare la recensione seguente.</p>
			[SUMMARY]
			[WARNING_MESSAGE]
		</fieldset>
		<fieldset>
			<legend>Azioni</legend>
			<p><button type="submit">Conferma eliminazione</button> <a href="[ANNULLA_HREF]">Annulla</a></p>
		</fieldset>
	</form>
</div>
