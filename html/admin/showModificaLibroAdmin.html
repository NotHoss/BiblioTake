<h1>Modifica libro</h1>

[MESSAGES]

[NOT_FOUND_MESSAGE]

<div [FORM_DISPLAY]>
    <form class="form admin-form" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" value="[LIBRO_ID]">

        <fieldset>
            <legend>Informazioni libro</legend>
            <p><label for="codice_isbn">ISBN</label><input type="text" name="codice_isbn" id="codice_isbn" value="[CODICE_ISBN]" required minlength="10" maxlength="20" pattern="[0-9Xx-]{10,20}" title="ISBN di 10 o 13 cifre"></p>
            <p><label for="titolo">Titolo</label><input type="text" name="titolo" id="titolo" value="[TITOLO]" required minlength="1" maxlength="30"></p>
            <p><label for="autore">Autore</label><input type="text" name="autore" id="autore" value="[AUTORE]" required minlength="1" maxlength="30"></p>
            <p><label for="casa_editrice">Casa editrice</label><input type="text" name="casa_editrice" id="casa_editrice" value="[CASA_EDITRICE]" required minlength="1" maxlength="30"></p>
            <p><label for="edizione">Edizione</label><input type="number" name="edizione" id="edizione" value="[EDIZIONE]" min="1" max="999" step="1" required></p>
            <p><label for="anno">Anno</label><input type="number" name="anno" id="anno" value="[ANNO]" min="1000" max="[CURRENT_YEAR]" step="1" required></p>
            <p><label for="lingua">Lingua</label><input type="text" name="lingua" id="lingua" value="[LINGUA]" required minlength="1" maxlength="30"></p>
        </fieldset>

        <fieldset>
            <legend>Descrizione e classificazione</legend>
            <p><label for="descrizione">Descrizione</label><textarea name="descrizione" id="descrizione" required minlength="1" maxlength="5000">[DESCRIZIONE]</textarea></p>
            <p><label for="pagine">Pagine</label><input type="number" name="pagine" id="pagine" value="[PAGINE]" min="1" max="99999" step="1" required></p>
            <p><label for="categoria-select-edit">Categoria</label>
                <select name="categoria" id="categoria-select-edit">
                    <option value="">-- Scegli una categoria --</option>
                    [CATEGORIE_OPTIONS]
                    <option value="__NEW__">+ Aggiungi nuova categoria</option>
                </select>
            </p>
            <p><label for="categoria-nuova-edit">Nuova categoria</label><input type="text" name="categoria_nuova" id="categoria-nuova-edit" maxlength="30" placeholder="Nome nuova categoria"></p>
            <p><label for="tags">Tag</label><input type="text" name="tags" id="tags" value="[TAGS]" maxlength="255" placeholder="es. Fantasy, Storico"></p>
        </fieldset>

        <fieldset>
            <legend>Copertina</legend>
            <p><label for="copertina_file">Carica nuova copertina (JPG, max 5MB)</label><input type="file" name="copertina_file" id="copertina_file" accept=".jpg,.jpeg,image/jpeg"></p>
            <p><label>Copertina corrente</label> [COPERTINA_CORRENTE]</p>
            <p><label for="delete_copertina"><input type="checkbox" name="delete_copertina" id="delete_copertina" value="1" [DELETE_COPERTINA_DISABLED] [DELETE_COPERTINA_TITLE]> Elimina copertina corrente</label></p>
        </fieldset>

        <fieldset>
            <legend>Azioni</legend>
            <p><button type="submit">Aggiorna generalità</button> <a href="index.php">Annulla</a></p>
        </fieldset>
        
    </form>
</div>
