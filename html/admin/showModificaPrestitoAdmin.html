<h1>Modifica prestito #[PRESTITO_IN_MODIFICA_ID]</h1>

[MESSAGES]

<form method="post">
    <input type="hidden" name="prestito_id" value="[PRESTITO_IN_MODIFICA_ID]">
    <p>
        <label>Data inizio
            <input type="datetime-local" name="data_inizio" value="[DATA_INIZIO]" required>
        </label>
    </p>
    <p>
        <label>Data fine
            <input type="datetime-local" name="data_fine" value="[DATA_FINE]" required>
        </label>
    </p>
    <p>
        <label>Stato
            <select name="stato" required>
                [STATO_OPTIONS]
            </select>
        </label>
    </p>
    <p>
        <label>Libro ID
            <input type="number" name="libro_id" min="1" value="[LIBRO_ID]" required>
        </label>
    </p>
    <p>
        <label>Utente ID
            <input type="number" name="nuovo_utente_id" min="1" value="[NUOVO_UTENTE_ID]" required>
        </label>
    </p>
    <p>
        <button type="submit" name="azione" value="salva_modifica">Salva modifiche</button>
        <a href="prestiti-utente.php?utente_id=[UTENTE_ID]">Annulla</a>
    </p>
</form>
