<div class="page-content-user">

    <form method="post" action="modifica-recensione.php" class="form form-recensione" id="form-recensione" data-validate="data-validate">
        <input type="hidden" name="id" value="[RECENSIONE_ID]" />
        <input type="hidden" name="return" value="[RETURN_VALUE]" />

        <p>Stai modificando la recensione del libro: <strong>[LIBRO_TITOLO]</strong></p>

        <label for="valutazione">Valutazione</label>
        <select name="valutazione" id="valutazione" required="required" min="1" max="5">
            <option value="">-- Seleziona --</option>
            <option value="1"[SEL1]>1 - Pessimo</option>
            <option value="2"[SEL2]>2 - Scarso</option>

        <p>
            <button type="submit" name="modifica-recensione">Salva modifiche</button>
