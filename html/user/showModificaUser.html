<div id="user-modifica">

    <noscript>
        <div class="auth-errors" role="alert">
            <ul><li>JavaScript è disabilitato. Alcune funzionalità potrebbero non essere disponibili.</li></ul>
        </div>
    </noscript>

    [TO-LOGIN]

    <h2>Modifica profilo</h2>

    <form method="POST" action="modifica-user.php" id="modifica-profilo" class="form user-edit-form" data-validate="data-validate">
        <section>
            <p>
                <label for="new_username">Username</label>
                <input type="text" id="new_username" name="new_username" value="[USERNAME]" required />
            </p>
            <p>
                <label for="new_email">Email</label>
                <input type="email" id="new_email" name="new_email" value="[EMAIL]" required />
            </p>
            <p>
                <label for="current_password">Password attuale</label>
                <input type="password" id="current_password" name="current_password" />
            </p>
            <p>
                <label for="new_password">Nuova password</label>
                <input type="password" id="new_password" name="new_password" />
            </p>
            <p>
                <label for="confirm_new_password">Conferma nuova password</label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" />
            </p>
        </section>
        <p class="form-actions">
            <button type="submit" name="salva-modifiche" class="btn-primary">Salva modifiche</button>
            <a href="dashboard.php" class="btn-secondary-link">Annulla</a>
        </p>
    </form>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('modifica-profilo');

        form.addEventListener('submit', function(e) {
            const inputs = form.querySelectorAll('input[name="new_username"], input[name="new_email"], input[name="current_password"], input[name="new_password"], input[name="confirm_new_password"]');

            let hasChanges = false;

            inputs.forEach(function(input) {
                if (input.value !== input.defaultValue) {
                    hasChanges = true;
                }
            });

            if (!hasChanges) {
                e.preventDefault();
                alert('Nessuna modifica rilevata.');
            }
        });
    });
</script>
