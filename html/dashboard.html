<!doctype html>
<html lang="it">
    <head>
        <link rel="preload" href="fonts/OpenDyslexic-Regular.woff2" as="fnt" type="font/woff2" crossorigin />
        <link rel="preload" href="fonts/OpenDyslexic-Bold.woff2" as="font" type="font/woff2" crossorigin />
    </head>
    
    <body>
        <div id="delete-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0b0b0b41; padding: 10px; z-index: 100; justify-content: center; align-items: center;">
            <div style="background-color: white; padding: 20px; border-radius: 5px; text-align: center; display: flex; flex-direction: column; gap: 20px;">
                <p style="font-size: larger;" >
                    Sei sicuro di voler eliminare il tuo account?
                </p>
                <div style="display: flex; width: 100%; justify-content: end; gap: 10px;">
                    <button id="confirm-delete" style="background-color: rgb(142, 28, 28); color: white; padding: 5px 8px; border: none; border-radius: 3px;">
                        Sì, elimina
                    </button>
                    <button id="cancel-delete" style=" background-color: lightgray; color: black; padding: 5px 8px; border: none; border-radius: 3px;">
                        Annulla
                    </button>
                </div>
            </div>
        </div>

        <div id="error-message"></div>

        <noscript>
            <div id="no-js-message">
                <strong>JavaScript &egrave; disabilitato.</strong>
            </div>
        </noscript>

        <div id="error-message"></div>

        <div id="page-content">
            [TO-LOGIN]
            <h2>[USERNAME]</h2>

            <div >
                <h3>Informazioni utente</h3>
                <div>
                    <img src="[IMMAGINE_PROFILO]" alt="Foto profilo di [USERNAME]" width="48" height="48">
                </div>
                <div >
                    <p>Email: [EMAIL]</p>
                    <p>Password: [PASSWORD]</p>
                </div>
            </div>
            <div>
                <a href="modifica-user.php">Modifica informazioni</a>
            </div>
            <div>
                <form method="post" action="elimina-user.php" id="form-delete">
                    <button type="submit">Elimina Account</button>
                </form>
            </div>
            
            <script src="scripts/back-to-top.js"></script>
        </div>

        <script>
            const formDelete = document.getElementById('form-delete');
            const deleteModal = document.getElementById('delete-modal');

            formDelete.addEventListener('submit', (event) => {
                event.preventDefault();
                deleteModal.style.display = 'flex';     //rende visibile la finestra di avviso (con display: flex)
            });

            document.getElementById('confirm-delete').addEventListener('click', () => {
                formDelete.submit();
            });

            document.getElementById('cancel-delete').addEventListener('click', () => {
                deleteModal.style.display = 'none';
            });
        </script>
    </body>
</html>
